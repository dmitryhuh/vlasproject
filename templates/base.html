{% load static %}

<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}Made{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    {% block extra_css %}{% endblock %}

</head>

<body>

<header class="site-header">
    <a href="{% url 'home' %}" class="logo">Made</a>

    {% if user.is_authenticated %}
        <a href="{% url 'logout' %}" class="logout">Вийти</a>
    {% else %}
        <div class="auth-header">
            <a href="{% url 'login' %}" class="header-login">Увійти</a>
            <a href="{% url 'register' %}" class="header-register">Реєстрація</a>
        </div>
    {% endif %}
</header>


<main>
    {% block content %}
    {% endblock %}
</main>


{% if user.is_authenticated %}

<nav class="bottom-nav">

    <a
        href="{% url 'home' %}"
        class="{% if request.resolver_match.url_name == 'home' %}active{% endif %}"
        aria-label="Головна"
    >
        <i class="bi bi-house"></i>
    </a>

    <a
        href="{% url 'search' %}"
        class="{% if request.resolver_match.url_name == 'search' %}active{% endif %}"
        aria-label="Пошук"
    >
        <i class="bi bi-search"></i>
    </a>

    <a
        href="{% url 'messenger:inbox' %}"
        class="{% if request.resolver_match.namespace == 'messenger' %}active{% endif %}"
        aria-label="Повідомлення"
        title="Повідомлення"
    >
        <i class="bi bi-chat-dots"></i>
    </a>

    <a
        href="{% url 'create_post' %}"
        class="plus"
        aria-label="Створити"
    >
        <i class="bi bi-plus"></i>
    </a>

    <a
        href="{% url 'notifications' %}"
        class="{% if request.resolver_match.url_name == 'notifications' %}active{% endif %}"
        aria-label="Сповіщення"
    >
        <i class="bi bi-bell"></i>
    </a>

    <a
        href="{% url 'profile' user.username %}"
        class="{% if request.resolver_match.url_name == 'profile' %}active{% endif %}"
        aria-label="Профіль"
    >
        <i class="bi bi-person"></i>
    </a>

</nav>

{% endif %}

    <script src="{% static 'js/main.js' %}"></script>

    {% block extra_js %}{% endblock %}
    
</body>
</html>
