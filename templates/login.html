{% extends "base.html" %}

{% block title %}Вхід — Made{% endblock %}

{% block content %}

<div class="auth-page">
    <div class="auth-box">

        <div class="auth-logo">Made</div>

        <h1>З поверненням</h1>

        <p class="auth-subtitle">Увійдіть у свій акаунт</p>

        {% if messages %}
            {% for message in messages %}
                <div class="auth-message">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <label class="auth-label">Username</label>
            <input type="text" name="username" placeholder="Введіть username" autocomplete="username" required>

            <label class="auth-label">Пароль</label>
            <input type="password" name="password" placeholder="Введіть пароль" autocomplete="current-password" required>

            <button type="submit">Увійти</button>
        </form>

        <div class="auth-footer">
            Ще не маєте акаунта? <a href="{% url 'register' %}">Зареєструватися</a>
        </div>

    </div>
</div>

{% endblock %}
