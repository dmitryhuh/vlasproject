{% extends "base.html" %}

{% block title %}Вхід — Made{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="auth-box">

        <h1>Вхід</h1>

        <p class="auth-subtitle">
            Увійдіть у свій акаунт Made
        </p>


        {% if messages %}
            {% for message in messages %}
                <div class="auth-message">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}


        <form method="post">
            {% csrf_token %}

            <input
                type="text"
                name="username"
                placeholder="Username"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Пароль"
                required
            >

            <button type="submit">
                Увійти
            </button>

        </form>


        <div class="auth-footer">
            Немає акаунта?
            <a href="{% url 'register' %}">
                Зареєструватися
            </a>
        </div>

    </div>

</div>

{% endblock %}
